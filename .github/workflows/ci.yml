name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - run: npm test
      - name: Camoufox smoke (fetch + about:blank)
        run: |
          npx camoufox fetch
          CAMOUFOX_HEADLESS=1 node scripts/smoke-launch.js
